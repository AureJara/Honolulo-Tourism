# Integración continua: todo lo que debe estar en verde antes de pasar un cambio a producción.
#   · pruebas      — revisión de secretos + pruebas unitarias y de integración de la librería común y de cada microservicio,
#                    con PostgreSQL real (embebido con pgserver) y con el mismo Python que las imágenes de Docker (3.12).
#   · qa           — las pruebas de extremo a extremo de qa/ contra el sistema COMPLETO (los 5 servicios) levantado en el propio
#                    runner, sin mocks. Las de rendimiento se ejecutan aparte y no bloquean: los tiempos de un runner
#                    compartido varían de una ejecución a otra.
#   · dependencias — pip-audit sobre las versiones fijadas.
#   · listo-para-produccion — resume los tres anteriores. Es la ÚNICA comprobación que conviene exigir en la protección de
#                    la rama main (Settings > Branches). Producción (AWS) se actualiza a mano con
#                    `git pull && docker compose up -d --build` solo cuando está en verde.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Secretos y pruebas
        run: python scripts/run_tests.py

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Sin límite por IP (la QA hace cientos de registros desde una misma IP) y con los correos en archivos (.mail/),
      # que es de donde las pruebas leen los códigos de verificación.
      - name: Levantar el sistema completo
        run: |
          nohup python scripts/dev.py up --mail file --no-rate-limit > dev-up.log 2>&1 &
          PID=$!
          listo() {
            python - <<'PY'
          import json, sys, urllib.request
          try:
              datos = json.load(urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3))
          except Exception:
              sys.exit(1)
          sys.exit(0 if all(v == "ok" for v in datos["dependencies"].values()) else 1)
          PY
          }
          for _ in $(seq 1 90); do
            listo && break
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::dev.py terminó antes de que el sistema estuviera listo."
              cat dev-up.log
              exit 1
            fi
            sleep 3
          done
          if ! listo; then
            echo "::error::El sistema no quedó listo en 4 minutos y medio."
            cat dev-up.log
            exit 1
          fi
          echo "Sistema listo:"
          curl -fsS http://127.0.0.1:8000/readyz

      - name: Pruebas de QA de extremo a extremo
        working-directory: qa
        run: python -m pytest -q -rs -p no:cacheprovider --ignore=test_performance.py --junitxml=../qa-junit.xml

      # La QA se omite sola si el sistema no responde; sin esta comprobación eso saldría en verde.
      - name: Comprobar que ninguna prueba se omitió por falta del sistema
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          raiz = ET.parse("qa-junit.xml").getroot()
          total = sum(int(s.get("tests", 0)) for s in ([raiz] if raiz.tag == "testsuite" else list(raiz)))
          omitidas = [(c.get("classname", "") + "::" + c.get("name", ""), s.get("message") or "")
                      for c in raiz.iter("testcase") for s in c.findall("skipped")]
          print(f"QA: {total} pruebas, {len(omitidas)} omitidas")
          for nombre, motivo in omitidas:
              print(f"  omitida: {nombre} — {motivo}")
          if total < 100:
              print(f"::error::Solo se recogieron {total} pruebas de QA (se esperaban más de 100).")
              sys.exit(1)
          if any("no está corriendo" in motivo for _, motivo in omitidas):
              print("::error::Se omitieron pruebas porque el sistema no estaba en marcha.")
              sys.exit(1)
          PY

      - name: Rendimiento (informativo, no bloquea)
        continue-on-error: true
        working-directory: qa
        run: python -m pytest -q -rs -s -p no:cacheprovider test_performance.py

      - name: Guardar los registros si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-qa
          path: |
            dev-up.log
            .logs/
            qa-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar vulnerabilidades conocidas en las versiones fijadas
        run: |
          pip install pip-audit
          pip-audit -r requirements-lock.txt --no-deps --disable-pip

  # Un trabajo omitido cuenta como «correcto» para la protección de ramas; por eso este corre siempre (`if: always()`) y
  # comprueba de forma explícita que los tres anteriores terminaron bien.
  listo-para-produccion:
    if: always()
    needs: [pruebas, qa, dependencias]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRUEBAS: ${{ needs.pruebas.result }}
      QA: ${{ needs.qa.result }}
      DEPENDENCIAS: ${{ needs.dependencias.result }}
    steps:
      - name: Resumen
        run: |
          echo "pruebas: $PRUEBAS · qa: $QA · dependencias: $DEPENDENCIAS"
          if [ "$PRUEBAS" != success ] || [ "$QA" != success ] || [ "$DEPENDENCIAS" != success ]; then
            echo "::error::No está listo para producción: alguna comprobación falló o no se ejecutó."
            exit 1
          fi
          echo "Todo en verde: se puede actualizar producción."
