{% extends "base.html" %}
{% block title %}{{ status }} — Honolulo{% endblock %}
{% block content %}
<main id="contenido" class="pt-32 pb-24">
  <div class="max-w-xl mx-auto px-6 text-center">
    <span class="material-symbols-outlined text-6xl text-primary" aria-hidden="true">{{ 'cloud_off' if status >= 500 else 'explore_off' }}</span>
    <p class="mt-4 font-headline text-sm font-bold tracking-wider text-tertiary uppercase">Error {{ status }}</p>
    <h1 class="mt-2 font-headline text-3xl font-bold text-on-surface">{{ title }}</h1>
    <p class="mt-3 text-on-surface-variant">{{ message }}</p>
    <a href="/" class="inline-flex items-center gap-2 mt-8 px-6 py-3 rounded-xl bg-primary text-on-primary font-headline font-semibold hover:bg-primary-container transition-colors">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">home</span>Volver al inicio
    </a>
  </div>
</main>
{% endblock %}
